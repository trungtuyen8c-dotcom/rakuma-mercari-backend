name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production-backend
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ① Version: next patch after the latest vX.Y.Z tag (first release v0.1.0)
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          LATEST=$(git tag --list 'v*.*.*' --sort=-v:refname | head -1)
          if [ -z "$LATEST" ]; then VERSION=v0.1.0; else VERSION=$(echo "$LATEST" | awk -F. '{print $1"."$2"."$3+1}'); fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Deploying $VERSION"

  # ② Test gate: re-run tests, do not trust the PR run alone
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test -p 1 -count=1 ./...
        env:
          TEST_DATABASE_URL: postgres://test:test@localhost:5432/test_db?sslmode=disable

  # ③ Build and push the image
  build-backend:
    needs: [version, test-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ④ Tag only after a successful build
  tag:
    needs: [version, build-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ needs.version.outputs.version }} -m "Release ${{ needs.version.outputs.version }}"
          git push origin ${{ needs.version.outputs.version }}

  # ⑤ Migrate + ⑥ deploy + ⑦ health check + ⑧ rollback
  # Migrations are embedded in the image and applied when the new container starts, before it serves traffic.
  # release.sh (infra repo) swaps only this service, health-checks, and restores the previous tag on failure.
  deploy:
    needs: [version, tag]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            trap 'docker logout ghcr.io >/dev/null' EXIT
            /var/www/rakuma/rakuma-mercari-infra/scripts/release.sh backend ${{ needs.version.outputs.version }}
